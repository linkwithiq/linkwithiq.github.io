name: Accessibility
on:
  push:
  pull_request:
jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright axe-core
      - run: npx playwright install --with-deps chromium
      - run: node scripts/a11y_check.js
