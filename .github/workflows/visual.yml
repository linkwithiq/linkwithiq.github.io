name: Visual check
# Compares screenshots of every page with the baselines in tests/visual/.
# First run (no baselines yet): download the "visual-baselines" artifact, put it in tests/visual/, commit.
on:
  pull_request:
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright pngjs pixelmatch@5
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual_check.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: tests/visual
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: tests/visual-diff
          if-no-files-found: ignore
