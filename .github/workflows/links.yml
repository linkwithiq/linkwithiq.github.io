name: External links
# Weekly check that outside links still work. Run manually any time.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme https --exclude 'fonts\.g' --exclude 'linkedin\.com' './*.html'
          fail: true
